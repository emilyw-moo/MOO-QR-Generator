<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Brand QR Code Generator</title>
  <!-- Load QR Code Styling Library from CDN -->
  <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f6f8;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 400px;
      width: 100%;
      box-sizing: border-box;
    }

    h3 {
      margin: 0;
      color: #122E1D;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #122E1D;
    }

    #qrcode {
      margin: 10px 0;
    }

    button {
      background-color: #122E1D;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="card">
    <h3>Brand QR Generator</h3>
    <input type="text" id="url-input" placeholder="Paste URL here..." value="https://example.com" />
    <div id="qrcode"></div>
    <button id="download-btn">Download SVG</button>
  </div>

  <script>
    const qrCode = new QRCodeStyling({
      width: 280,
      height: 280,
      type: "svg",
      data: "https://example.com",
      qrOptions: { errorCorrectionLevel: "H" },
      dotsOptions: { color: "#122E1D", type: "rounded" },
      backgroundOptions: { color: "transparent" },
      cornersSquareOptions: { color: "#122E1D", type: "extra-rounded" },
      cornersDotOptions: { color: "#122E1D", type: "dot" }
    });

    // Render the QR code base
    qrCode.append(document.getElementById("qrcode"));

    function injectVectorLogo() {
      setTimeout(() => {
        const svgElement = document.querySelector("#qrcode svg");
        if (!svgElement) return;

        // Remove any previously injected logo group
        const existingLogo = svgElement.querySelector("#custom-droplet-logo");
        if (existingLogo) existingLogo.remove();

        // 1. Scaled Droplet Dimensions at scale(1.4)
        // Original Drop Bounds: Width = 29.88px, Height = 44.95px
        const scale = 1.4;
        const dropWidth = 29.88 * scale;   // 41.83px
        const dropHeight = 44.95 * scale;  // 62.93px

        // 2. Padding Specs: 16px horizontal, 9px vertical
        const maskWidth = dropWidth + (16 * 2);   // 73.83px
        const maskHeight = dropHeight + (9 * 2);  // 80.93px

        // 3. Perfect Canvas Centering (Canvas = 280px x 280px)
        const maskX = (280 - maskWidth) / 2;     // 103.08px
        const maskY = (280 - maskHeight) / 2;    // 99.53px

        const dropX = (280 - dropWidth) / 2;     // 119.08px
        const dropY = (280 - dropHeight) / 2;    // 108.53px

        // Mask Out Center QR Modules
        const maskRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        maskRect.setAttribute("x", maskX);
        maskRect.setAttribute("y", maskY);
        maskRect.setAttribute("width", maskWidth);
        maskRect.setAttribute("height", maskHeight);
        maskRect.setAttribute("fill", "#ffffff");
        maskRect.setAttribute("rx", "10");

        // Group Container
        const logoGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        logoGroup.setAttribute("id", "custom-droplet-logo");
        
        // Normalized Path (origin normalized to 0,0)
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("fill", "#122E1D");
        path.setAttribute("d", "M14.94,44.95h0c-4.67,0-8.98-2.13-11.84-5.84-2.03-2.63-3.1-5.78-3.1-9.1,0-1.02,0.1-2.04,0.31-3.03,0.53-3.3,3-8.77,7.32-16.24,3.21-5.54,5.93-9.65,5.96-9.69,0.32-0.47,0.68-0.99,1.36-0.99s1.04,0.52,1.36,0.99c0.03,0.04,2.77,4.2,5.96,9.7,4.33,7.47,6.79,12.94,7.32,16.26,0.2,0.97,0.3,1.99,0.3,3.01,0,3.32-1.07,6.46-3.1,9.1-2.86,3.71-7.18,5.84-11.84,5.84");
        
        // Translate directly to centered coordinates
        path.setAttribute("transform", `translate(${dropX}, ${dropY}) scale(${scale})`);

        logoGroup.appendChild(maskRect);
        logoGroup.appendChild(path);
        svgElement.appendChild(logoGroup);
      }, 50);
    }

    // Initial injection
    injectVectorLogo();

    // Update QR code live when typing
    document.getElementById("url-input").addEventListener("input", (e) => {
      qrCode.update({ data: e.target.value || "https://example.com" });
      injectVectorLogo();
    });

    // Custom SVG Download logic preserving pure vector paths for Illustrator
    document.getElementById("download-btn").addEventListener("click", () => {
      const svgElement = document.querySelector("#qrcode svg").cloneNode(true);
      const svgData = new XMLSerializer().serializeToString(svgElement);
      const svgBlob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
      const svgUrl = URL.createObjectURL(svgBlob);
      
      const downloadLink = document.createElement("a");
      downloadLink.href = svgUrl;
      downloadLink.download = "brand-qr-code.svg";
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
    });
  </script>
</body>
</html>
