<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Brand QR Code Generator</title>
  <!-- Load QR Code Styling Library from CDN -->
  <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f6f8;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 400px;
      width: 100%;
      box-sizing: border-box;
    }

    h3 {
      margin: 0;
      color: #122E1D;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #122E1D;
    }

    #qrcode {
      margin: 10px 0;
    }

    button {
      background-color: #122E1D;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="card">
    <h3>Brand QR Generator</h3>
    <input type="text" id="url-input" placeholder="Paste URL here..." value="https://example.com" />
    <div id="qrcode"></div>
    <button id="download-btn">Download SVG</button>
  </div>

  <script>
    const qrCode = new QRCodeStyling({
      width: 280,
      height: 280,
      type: "svg",
      data: "https://example.com",
      qrOptions: { errorCorrectionLevel: "H" },
      dotsOptions: { color: "#122E1D", type: "rounded" },
      backgroundOptions: { color: "transparent" },
      cornersSquareOptions: { color: "#122E1D", type: "extra-rounded" },
      cornersDotOptions: { color: "#122E1D", type: "dot" }
    });

    // Render the QR code base
    qrCode.append(document.getElementById("qrcode"));

    // Function to clear center modules & inject pure vector path with custom padding
    function injectVectorLogo() {
      setTimeout(() => {
        const svgElement = document.querySelector("#qrcode svg");
        if (!svgElement) return;

        // Remove any previously injected logo group
        const existingLogo = svgElement.querySelector("#custom-droplet-logo");
        if (existingLogo) existingLogo.remove();

        // Droplet native dimensions at scale(1.4): Width = ~42px, Height = ~63px
        // Adding 16px padding left/right (42 + 32 = 74) and 9px top/bottom (63 + 18 = 81)
        const maskWidth = 74;  
        const maskHeight = 81; 

        const maskX = (280 - maskWidth) / 2;  // 103px
        const maskY = (280 - maskHeight) / 2; // 99.5px

        // Mask out center QR modules with the customized rectangular clear space
        const maskRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        maskRect.setAttribute("x", maskX);
        maskRect.setAttribute("y", maskY);
        maskRect.setAttribute("width", maskWidth);
        maskRect.setAttribute("height", maskHeight);
        maskRect.setAttribute("fill", "#ffffff");
        maskRect.setAttribute("rx", "10"); // Corner radius of the mask

        // Create Group Container for Droplet
        const logoGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        logoGroup.setAttribute("id", "custom-droplet-logo");
        
        // Native vector path from your Illustrator file
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("fill", "#122E1D");
        path.setAttribute("d", "M31.34,116.45h0c-4.67,0-8.98-2.13-11.84-5.84-2.03-2.63-3.1-5.78-3.1-9.1,0-1.02.1-2.04.31-3.03.53-3.3,3-8.77,7.32-16.24,3.21-5.54,5.93-9.65,5.96-9.69.32-.47.68-.99,1.36-.99s1.04.52,1.36.99c.03.04,2.77,4.2,5.96,9.7,4.33,7.47,6.79,12.94,7.32,16.26.2.97.3,1.99.3,3.01,0,3.32-1.07,6.46-3.1,9.1-2.86,3.71-7.18,5.84-11.84,5.84");
        
        // Exact mathematical alignment to center the droplet at (140, 140)
        path.setAttribute("transform", "translate(96.12, 10.5) scale(1.4)");

        logoGroup.appendChild(maskRect);
        logoGroup.appendChild(path);
        svgElement.appendChild(logoGroup);
      }, 50);
    }

    // Initial injection
    injectVectorLogo();

    // Update QR code live when typing & re-inject vector logo
    document.getElementById("url-input").addEventListener("input", (e) => {
      qrCode.update({ data: e.target.value || "https://example.com" });
      injectVectorLogo();
    });

    // Custom SVG Download logic preserving pure vector paths for Illustrator
    document.getElementById("download-btn").addEventListener("click", () => {
      const svgElement = document.querySelector("#qrcode svg").cloneNode(true);
      const svgData = new XMLSerializer().serializeToString(svgElement);
      const svgBlob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
      const svgUrl = URL.createObjectURL(svgBlob);
      
      const downloadLink = document.createElement("a");
      downloadLink.href = svgUrl;
      downloadLink.download = "brand-qr-code.svg";
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
    });
  </script>
</body>
</html>
