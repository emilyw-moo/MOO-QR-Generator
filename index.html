<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: sans-serif; padding: 12px; margin: 0; background: #fff; }
    input { width: 100%; padding: 8px; box-sizing: border-box; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; background: #062C19; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    #canvas { display: none; }
  </style>
  <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
</head>
<body>
  <input type="text" id="url" placeholder="Enter target URL..." value="https://example.com" />
  <button id="create">Insert into Figma</button>
  <div id="canvas"></div>

  <script>
    const dropletSVG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23062C19'><path d='M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z'/></svg>";

    const qrCode = new QRCodeStyling({
      width: 500,
      height: 500,
      type: "svg",
      data: "https://example.com",
      image: dropletSVG,
      qrOptions: { errorCorrectionLevel: "H" },
      imageOptions: { hideBackgroundDots: true, imageSize: 0.25, margin: 4 },
      dotsOptions: { color: "#062C19", type: "rounded" },
      backgroundOptions: { color: "#ffffff" },
      cornersSquareOptions: { color: "#062C19", type: "extra-rounded" },
      cornersDotOptions: { color: "#062C19", type: "dot" }
    });

    qrCode.append(document.getElementById("canvas"));

    document.getElementById('create').onclick = async () => {
      const text = document.getElementById('url').value;
      qrCode.update({ data: text });
      
      // Wait for SVG render
      setTimeout(async () => {
        const svgBlob = await qrCode.getRawData("svg");
        const reader = new FileReader();
        reader.readAsText(svgBlob);
        reader.onloadend = () => {
          parent.postMessage({ pluginMessage: { type: 'create-qr', svg: reader.result } }, '*');
        };
      }, 100);
    };
  </script>
</body>
</html>
