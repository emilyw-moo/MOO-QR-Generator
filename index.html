<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Brand QR Code Generator</title>
  <!-- Load QR Code Styling Library from CDN -->
  <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f6f8;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 400px;
      width: 100%;
      box-sizing: border-box;
    }

    h3 {
      margin: 0;
      color: #122E1D;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #122E1D;
    }

    #qrcode {
      margin: 10px 0;
    }

    button {
      background-color: #122E1D;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="card">
    <h3>Brand QR Generator</h3>
    <input type="text" id="url-input" placeholder="Paste URL here..." value="https://example.com" />
    <div id="qrcode"></div>
    <button id="download-btn">Download SVG</button>
  </div>

  <script>
    // Droplet SVG with brand color #122E1D
    const dropletSVG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23122E1D'><path d='M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z'/></svg>";

    const qrCode = new QRCodeStyling({
      width: 280,
      height: 280,
      type: "canvas",
      data: "https://example.com",
      image: dropletSVG,
      qrOptions: { errorCorrectionLevel: "H" },
      imageOptions: { hideBackgroundDots: true, imageSize: 0.25, margin: 4 },
      dotsOptions: { color: "#122E1D", type: "rounded" },
      backgroundOptions: { color: "#ffffff" },
      cornersSquareOptions: { color: "#122E1D", type: "extra-rounded" },
      cornersDotOptions: { color: "#122E1D", type: "dot" }
    });

    // Render the QR code
    qrCode.append(document.getElementById("qrcode"));

    // Update QR code live when typing
    document.getElementById("url-input").addEventListener("input", (e) => {
      qrCode.update({ data: e.target.value || "https://example.com" });
    });

    // Working download button handler
    document.getElementById("download-btn").addEventListener("click", () => {
      qrCode.download({ name: "brand-qr-code", extension: "svg" });
    });
  </script>
</body>
</html>
