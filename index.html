<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Brand QR Code Generator</title>
  <!-- Load QR Code Styling Library from CDN -->
  <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f6f8;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 400px;
      width: 100%;
      box-sizing: border-box;
    }

    h3 {
      margin: 0;
      color: #122E1D;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #122E1D;
    }

    #qrcode {
      margin: 10px 0;
    }

    button {
      background-color: #122E1D;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="card">
    <h3>Brand QR Generator</h3>
    <input type="text" id="url-input" placeholder="Paste URL here..." value="https://example.com" />
    <div id="qrcode"></div>
    <button id="download-btn">Download SVG</button>
  </div>

  <script>
    // FIXED PHYSICAL PIXEL DIMENSIONS (Never scale with QR grid density)
    const CANVAS_SIZE = 188;     // 188px x 188px total canvas
    const CLEAR_ZONE_SIZE = 63; // 63px x 63px center box
    const CORNER_RADIUS = 6;    // 6px rounded corners
    const DROP_WIDTH = 31;      // 31px drop width (16px side padding)
    const DROP_HEIGHT = 43;     // 43px drop height (10px top/bottom padding)

    const qrCode = new QRCodeStyling({
      width: CANVAS_SIZE,
      height: CANVAS_SIZE,
      type: "svg",
      data: "https://example.com",
      qrOptions: { errorCorrectionLevel: "H" },
      dotsOptions: { color: "#122E1D", type: "rounded" },
      backgroundOptions: { color: "transparent" },
      cornersSquareOptions: { color: "#122E1D", type: "extra-rounded" },
      cornersDotOptions: { color: "#122E1D", type: "dot" }
    });

    // Render base QR code
    qrCode.append(document.getElementById("qrcode"));

    function enforceFixedDimensions() {
      // Small timeout ensures the library finishes DOM updates before we punch the cutout
      setTimeout(() => {
        const svgElement = document.querySelector("#qrcode svg");
        if (!svgElement) return;

        const center = CANVAS_SIZE / 2; // 94px
        const x = center - (CLEAR_ZONE_SIZE / 2); // 62.5px
        const y = center - (CLEAR_ZONE_SIZE / 2); // 62.5px

        // 1. Create permanent <defs> container
        let defs = svgElement.querySelector("defs");
        if (!defs) {
          defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
          svgElement.insertBefore(defs, svgElement.firstChild);
        }

        // 2. Re-inject permanent Mask element
        let mask = svgElement.querySelector("#fixed-rounded-mask");
        if (mask) mask.remove();

        mask = document.createElementNS("http://www.w3.org/2000/svg", "mask");
        mask.setAttribute("id", "fixed-rounded-mask");
        mask.setAttribute("maskUnits", "userSpaceOnUse");

        // White background preserves all surrounding QR modules
        const whiteCanvas = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        whiteCanvas.setAttribute("x", "0");
        whiteCanvas.setAttribute("y", "0");
        whiteCanvas.setAttribute("width", CANVAS_SIZE);
        whiteCanvas.setAttribute("height", CANVAS_SIZE);
        whiteCanvas.setAttribute("fill", "#ffffff");

        // Black rounded rectangle cuts an absolute 63x63px transparent window in the center
        const blackHole = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        blackHole.setAttribute("x", x);
        blackHole.setAttribute("y", y);
        blackHole.setAttribute("width", CLEAR_ZONE_SIZE);
        blackHole.setAttribute("height", CLEAR_ZONE_SIZE);
        blackHole.setAttribute("rx", CORNER_RADIUS);
        blackHole.setAttribute("ry", CORNER_RADIUS);
        blackHole.setAttribute("fill", "#000000");

        mask.appendChild(whiteCanvas);
        mask.appendChild(blackHole);
        defs.appendChild(mask);

        // Apply mask to ALL QR paths generated by the library
        const allPaths = svgElement.querySelectorAll("path, rect");
        allPaths.forEach(el => {
          if (el.id !== "moo-drop-path") {
            el.setAttribute("mask", "url(#fixed-rounded-mask)");
          }
        });

        // 3. Inject native vector droplet locked to center of the transparent cutout
        let existingLogo = svgElement.querySelector("#custom-droplet-logo");
        if (existingLogo) existingLogo.remove();

        const logoGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        logoGroup.setAttribute("id", "custom-droplet-logo");

        const dropSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        dropSvg.setAttribute("x", center - (DROP_WIDTH / 2));  // 78.5px
        dropSvg.setAttribute("y", center - (DROP_HEIGHT / 2)); // 72.5px
        dropSvg.setAttribute("width", DROP_WIDTH);
        dropSvg.setAttribute("height", DROP_HEIGHT);
        dropSvg.setAttribute("viewBox", "0 0 29.88 44.95");

        const dropPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
        dropPath.setAttribute("id", "moo-drop-path");
        dropPath.setAttribute("fill", "#122E1D");
        dropPath.setAttribute("d", "M14.94,44.95h0c-4.67,0-8.98-2.13-11.84-5.84-2.03-2.63-3.1-5.78-3.1-9.1,0-1.02,0.1-2.04,0.31-3.03,0.53-3.3,3-8.77,7.32-16.24,3.21-5.54,5.93-9.65,5.96-9.69,0.32-0.47,0.68-0.99,1.36-0.99s1.04,0.52,1.36,0.99c0.03,0.04,2.77,4.2,5.96,9.7,4.33,7.47,6.79,12.94,7.32,16.26,0.2,0.97,0.3,1.99,0.3,3.01,0,3.32-1.07,6.46-3.1,9.1-2.86,3.71-7.18,5.84-11.84,5.84");

        dropSvg.appendChild(dropPath);
        logoGroup.appendChild(dropSvg);
        svgElement.appendChild(logoGroup);
      }, 50);
    }

    // Initial run
    enforceFixedDimensions();

    // Update live when typing (re-applies absolute pixel mask on every text change)
    document.getElementById("url-input").addEventListener("input", (e) => {
      qrCode.update({ data: e.target.value || "https://example.com" });
      enforceFixedDimensions();
    });

    // Download handler exporting pure vector SVG to Illustrator
    document.getElementById("download-btn").addEventListener("click", () => {
      const svgElement = document.querySelector("#qrcode svg").cloneNode(true);

      const svgData = new XMLSerializer().serializeToString(svgElement);
      const svgBlob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
      const svgUrl = URL.createObjectURL(svgBlob);

      const downloadLink = document.createElement("a");
      downloadLink.href = svgUrl;
      downloadLink.download = "brand-qr-code.svg";
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
    });
  </script>
</body>
</html>
