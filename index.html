<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Brand QR Code Generator</title>
  <!-- Load QR Code Styling Library from CDN -->
  <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f6f8;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 400px;
      width: 100%;
      box-sizing: border-box;
    }

    h3 {
      margin: 0;
      color: #122E1D;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #122E1D;
    }

    #qrcode {
      margin: 10px 0;
    }

    button {
      background-color: #122E1D;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="card">
    <h3>Brand QR Generator</h3>
    <input type="text" id="url-input" placeholder="Paste URL here..." value="https://example.com" />
    <div id="qrcode"></div>
    <button id="download-btn">Download SVG</button>
  </div>

  <script>
    const CANVAS_SIZE = 188;

    // Blank mask image used ONLY to force the library to clear the 63px center grid
    const blankCenterMask = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 63 63' width='63' height='63'></svg>";

    const qrCode = new QRCodeStyling({
      width: CANVAS_SIZE,
      height: CANVAS_SIZE,
      type: "svg",
      data: "https://example.com",
      image: blankCenterMask,
      qrOptions: { errorCorrectionLevel: "H" },
      imageOptions: {
        hideBackgroundDots: true, // Clears the 63px center grid transparently
        imageSize: 0.335,         // 63px / 188px
        margin: 0
      },
      dotsOptions: { color: "#122E1D", type: "rounded" },
      backgroundOptions: { color: "transparent" },
      cornersSquareOptions: { color: "#122E1D", type: "extra-rounded" },
      cornersDotOptions: { color: "#122E1D", type: "dot" }
    });

    // Render the QR code base
    qrCode.append(document.getElementById("qrcode"));

    // Inject native vector droplet for screen preview
    function injectPreviewDroplet() {
      setTimeout(() => {
        const svgElement = document.querySelector("#qrcode svg");
        if (!svgElement) return;

        // Remove previous preview droplet
        const existingLogo = svgElement.querySelector("#custom-droplet-logo");
        if (existingLogo) existingLogo.remove();

        // Target: Center 30x45px drop inside 188px canvas
        const center = CANVAS_SIZE / 2; // 94px
        const dropW = 30;
        const dropH = 45;

        const logoGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        logoGroup.setAttribute("id", "custom-droplet-logo");

        const dropSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        dropSvg.setAttribute("x", center - (dropW / 2)); // 79px
        dropSvg.setAttribute("y", center - (dropH / 2)); // 71.5px
        dropSvg.setAttribute("width", dropW);
        dropSvg.setAttribute("height", dropH);
        dropSvg.setAttribute("viewBox", "0 0 29.88 44.95");

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("fill", "#122E1D");
        path.setAttribute("d", "M14.94,44.95h0c-4.67,0-8.98-2.13-11.84-5.84-2.03-2.63-3.1-5.78-3.1-9.1,0-1.02,0.1-2.04,0.31-3.03,0.53-3.3,3-8.77,7.32-16.24,3.21-5.54,5.93-9.65,5.96-9.69,0.32-0.47,0.68-0.99,1.36-0.99s1.04,0.52,1.36,0.99c0.03,0.04,2.77,4.2,5.96,9.7,4.33,7.47,6.79,12.94,7.32,16.26,0.2,0.97,0.3,1.99,0.3,3.01,0,3.32-1.07,6.46-3.1,9.1-2.86,3.71-7.18,5.84-11.84,5.84");

        dropSvg.appendChild(path);
        logoGroup.appendChild(dropSvg);
        svgElement.appendChild(logoGroup);
      }, 50);
    }

    injectPreviewDroplet();

    // Update QR code live when typing
    document.getElementById("url-input").addEventListener("input", (e) => {
      qrCode.update({ data: e.target.value || "https://example.com" });
      injectPreviewDroplet();
    });

    // Custom Download Handler that converts embedded <image> to pure Illustrator-compatible <path>
    document.getElementById("download-btn").addEventListener("click", () => {
      const svgElement = document.querySelector("#qrcode svg").cloneNode(true);

      // Remove the embedded <image> tag that Illustrator hides
      const imageTag = svgElement.querySelector("image");
      if (imageTag) imageTag.remove();

      // Ensure the native vector droplet is present in the downloaded SVG
      let logoGroup = svgElement.querySelector("#custom-droplet-logo");
      if (!logoGroup) {
        const center = CANVAS_SIZE / 2;
        const dropW = 30;
        const dropH = 45;

        logoGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        logoGroup.setAttribute("id", "custom-droplet-logo");

        const dropSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        dropSvg.setAttribute("x", center - (dropW / 2));
        dropSvg.setAttribute("y", center - (dropH / 2));
        dropSvg.setAttribute("width", dropW);
        dropSvg.setAttribute("height", dropH);
        dropSvg.setAttribute("viewBox", "0 0 29.88 44.95");

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("fill", "#122E1D");
        path.setAttribute("d", "M14.94,44.95h0c-4.67,0-8.98-2.13-11.84-5.84-2.03-2.63-3.1-5.78-3.1-9.1,0-1.02,0.1-2.04,0.31-3.03,0.53-3.3,3-8.77,7.32-16.24,3.21-5.54,5.93-9.65,5.96-9.69,0.32-0.47,0.68-0.99,1.36-0.99s1.04,0.52,1.36,0.99c0.03,0.04,2.77,4.2,5.96,9.7,4.33,7.47,6.79,12.94,7.32,16.26,0.2,0.97,0.3,1.99,0.3,3.01,0,3.32-1.07,6.46-3.1,9.1-2.86,3.71-7.18,5.84-11.84,5.84");

        dropSvg.appendChild(path);
        logoGroup.appendChild(dropSvg);
        svgElement.appendChild(logoGroup);
      }

      // Export pure vector SVG file
      const svgData = new XMLSerializer().serializeToString(svgElement);
      const svgBlob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
      const svgUrl = URL.createObjectURL(svgBlob);

      const downloadLink = document.createElement("a");
      downloadLink.href = svgUrl;
      downloadLink.download = "brand-qr-code.svg";
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
    });
  </script>
</body>
</html>
